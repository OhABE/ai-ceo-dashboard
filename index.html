<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>安部 司令室</title>
  <link rel="stylesheet" href="style.css?v=20260611c">
</head>
<body>
  <div class="app">

    <header>
      <div class="logo">CEO</div>
      <div class="header-info">
        <div class="header-title">安部 司令室</div>
        <div class="header-date" id="current-date"></div>
      </div>
    </header>

    <div class="cards">

      <div class="card" data-cat="channel">
        <div class="card-top">
          <span class="cat-icon">🎥</span>
          <span class="cat-title">Oh!アベチャンネル</span>
        </div>
        <div class="todo-area">
          <div class="todo-label">今やること</div>
          <div class="todo-text" id="todo-channel" data-key="todo-channel">タップして入力...</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ai" data-cat="channel">🤖 AI相談</button>
          <button class="btn btn-record" data-cat="channel">📝 記録</button>
          <button class="btn btn-memo" data-cat="channel">📂 メモ</button>
        </div>
      </div>

      <div class="card" data-cat="work">
        <div class="card-top">
          <span class="cat-icon">📈</span>
          <span class="cat-title">仕事・営業</span>
        </div>
        <div class="todo-area">
          <div class="todo-label">今やること</div>
          <div class="todo-text" id="todo-work" data-key="todo-work">タップして入力...</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ai" data-cat="work">🤖 AI相談</button>
          <button class="btn btn-record" data-cat="work">📝 記録</button>
          <button class="btn btn-memo" data-cat="work">📂 メモ</button>
        </div>
      </div>

      <div class="card" data-cat="side">
        <div class="card-top">
          <span class="cat-icon">🚁</span>
          <span class="cat-title">副業・依頼</span>
        </div>
        <div class="todo-area">
          <div class="todo-label">今やること</div>
          <div class="todo-text" id="todo-side" data-key="todo-side">タップして入力...</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ai" data-cat="side">🤖 AI相談</button>
          <button class="btn btn-record" data-cat="side">📝 記録</button>
          <button class="btn btn-memo" data-cat="side">📂 メモ</button>
        </div>
      </div>

      <div class="card" data-cat="appdev">
        <div class="card-top">
          <span class="cat-icon">💻</span>
          <span class="cat-title">アプリ開発</span>
        </div>
        <div class="todo-area">
          <div class="todo-label">今やること</div>
          <div class="todo-text" id="todo-appdev" data-key="todo-appdev">タップして入力...</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ai" data-cat="appdev">🤖 AI相談</button>
          <button class="btn btn-record" data-cat="appdev">📝 記録</button>
          <button class="btn btn-memo" data-cat="appdev">📂 メモ</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 今やること編集モーダル -->
  <div class="modal" id="edit-modal">
    <div class="modal-box">
      <div class="modal-title">今やることを編集</div>
      <textarea id="edit-text" rows="3" placeholder="今やることを入力..."></textarea>
      <div class="modal-btns">
        <button id="edit-save">保存</button>
        <button id="edit-cancel" class="btn-sub">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 記録モーダル -->
  <div class="modal" id="record-modal">
    <div class="modal-box">
      <div class="modal-title" id="record-title">記録する</div>
      <textarea id="record-text" rows="4" placeholder="メモを入力..."></textarea>
      <div class="modal-btns">
        <button id="record-save">保存</button>
        <button id="record-cancel" class="btn-sub">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 過去メモモーダル -->
  <div class="modal" id="memo-modal">
    <div class="modal-box">
      <div class="modal-title" id="memo-title">過去メモ</div>
      <div id="memo-list"></div>
      <div class="modal-btns">
        <button id="memo-close" class="btn-sub">閉じる</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div class="toast" id="toast"></div>

  <script src="app.js?v=20260611c"></script>
</body>
</html>
