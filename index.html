<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CEO — 安部社長 経営コックピット</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=20260610b">
</head>
<body>
  <div class="app">

    <!-- ヘッダー -->
    <header>
      <div class="header-left">
        <div class="logo-mark">CEO</div>
        <div>
          <h1>AI CEO <span class="header-sub">経営コックピット</span></h1>
          <p class="header-tagline">安部社長専属 経営参謀システム</p>
        </div>
      </div>
      <div class="header-right">
        <div class="status-dot"></div>
        <span id="current-date"></span>
      </div>
    </header>

    <!-- KPIメトリクス -->
    <section class="metrics">
      <div class="metric-card">
        <div class="metric-label">今週の重点案件</div>
        <div class="metric-value" id="metric-focus">向津具マラソン遠征</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">今月 売上目標達成率</div>
        <div class="metric-value" id="metric-sales">— %</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">進行中プロジェクト</div>
        <div class="metric-value" id="metric-projects">3</div>
      </div>
    </section>

    <!-- 戦略エリア -->
    <section class="strategy-grid">

      <!-- ① メインビジネス戦略 -->
      <div class="strategy-card" data-color="blue">
        <div class="card-header">
          <span class="card-icon">📈</span>
          <div>
            <div class="card-title">メインビジネス戦略</div>
            <div class="card-sub">株式会社キフネ</div>
          </div>
        </div>
      </div>

      <!-- ② SkyStage戦略 -->
      <div class="strategy-card" data-color="teal">
        <div class="card-header">
          <span class="card-icon">🚁</span>
          <div>
            <div class="card-title">SkyStage戦略</div>
            <div class="card-sub">ドローン・映像事業</div>
          </div>
        </div>
      </div>

      <!-- ③ Oh!アベチャンネル戦略 -->
      <div class="strategy-card" data-color="red">
        <div class="card-header">
          <span class="card-icon">🎥</span>
          <div>
            <div class="card-title">Oh!アベチャンネル戦略</div>
            <div class="card-sub">YouTube収益化</div>
          </div>
        </div>
      </div>

      <!-- ④ 新規事業 -->
      <div class="strategy-card" data-color="purple">
        <div class="card-header">
          <span class="card-icon">💰</span>
          <div>
            <div class="card-title">新規事業</div>
            <div class="card-sub">収益多角化</div>
          </div>
        </div>
      </div>

      <!-- ⑤ 今週の優先順位 -->
      <div class="strategy-card" data-color="gold">
        <div class="card-header">
          <span class="card-icon">📅</span>
          <div>
            <div class="card-title">今週の優先順位</div>
            <div class="card-sub">時間と集中の最適化</div>
          </div>
        </div>
      </div>

      <!-- ⑥ 経営ダッシュボード -->
      <div class="strategy-card" data-color="slate">
        <div class="card-header">
          <span class="card-icon">📊</span>
          <div>
            <div class="card-title">経営ダッシュボード</div>
            <div class="card-sub">全体状況の把握</div>
          </div>
        </div>
      </div>

    </section>


  </div>

  <script src="app.js?v=20260610b"></script>
</body>
</html>
